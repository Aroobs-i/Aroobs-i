<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12002b"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>

    <filter id="glowMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBorder" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- outer pulsing glow border -->
  <rect x="20" y="20" width="860" height="360" rx="14" fill="none"
        stroke="#ff2bd6" stroke-width="2.5" filter="url(#glowBorder)" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal window -->
  <rect x="20" y="20" width="860" height="360" rx="14" fill="url(#bgGrad)" stroke="#ff2bd6" stroke-width="1.4"/>
  <rect x="20" y="20" width="860" height="34" rx="14" fill="#160026"/>
  <rect x="20" y="40" width="860" height="14" fill="#160026"/>
  <circle cx="42" cy="37" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="37" r="6" fill="#ffbd2e"/>
  <circle cx="82" cy="37" r="6" fill="#27c93f"/>
  <text x="450" y="42" text-anchor="middle" fill="#6f6f8a" font-size="13">arooba@jobs — python3</text>

  <g fill="#e8e8f0" font-size="15">

    <!-- act 1 prompt: always visible, resting state between loops -->
    <text x="45" y="90" fill="#7b2ff7">arooba@jobs</text>
    <text x="150" y="90" fill="#6f6f8a">:~$</text>

    <g clip-path="url(#clipC1)">
      <text x="185" y="90" fill="#e8e8f0">python etl_pipeline.py</text>
    </g>
    <clipPath id="clipC1">
      <rect x="185" y="76" height="20" width="0">
        <animate attributeName="width" dur="14s" repeatCount="indefinite"
          keyTimes="0;0.007;0.093;0.893;0.936;1"
          values="0;0;230;230;0;0"/>
      </rect>
    </clipPath>

    <g opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.114;0.143;0.893;0.936;1" values="0;0;1;1;0;0"/>
      <text x="45" y="124" fill="#00fff5">→ Global dataset: 1,000,000+ postings</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.164;0.193;0.893;0.936;1" values="0;0;1;1;0;0"/>
      <text x="45" y="148" fill="#00fff5">→ Filtered to data/analytics roles: 12,900</text>
    </g>

    <!-- sweep bar: "training the model" -->
    <rect x="45" y="164" width="0" height="4" rx="2" fill="#00fff5" filter="url(#glowCyan)" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.271;0.278;0.328;0.90;0.936;1" values="0;0;1;1;1;0;0"/>
      <animate attributeName="width" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.271;0.328;1" values="0;0;790;790"/>
    </rect>

    <!-- act 2 prompt: hidden until this act begins -->
    <g opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.348;0.351;0.893;0.936;1" values="0;0;1;1;0;0"/>
      <text x="45" y="182" fill="#7b2ff7">arooba@jobs</text>
      <text x="150" y="182" fill="#6f6f8a">:~$</text>
    </g>
    <g clip-path="url(#clipC2)">
      <text x="185" y="182" fill="#e8e8f0">python train_model.py</text>
    </g>
    <clipPath id="clipC2">
      <rect x="185" y="168" height="20" width="0">
        <animate attributeName="width" dur="14s" repeatCount="indefinite"
          keyTimes="0;0.350;0.436;0.893;0.936;1" values="0;0;220;220;0;0"/>
      </rect>
    </clipPath>

    <g opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.457;0.486;0.893;0.936;1" values="0;0;1;1;0;0"/>
      <text x="45" y="216" fill="#9d9db3">Feature importance (Random Forest):</text>
    </g>

    <!-- winning feature: total_skill_count -->
    <g opacity="0" filter="url(#glowMagenta)">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.507;0.536;0.893;0.936;1" values="0;0;1;1;0;0"/>
      <text x="45" y="248" fill="#ff2bd6">total_skill_count</text>
      <text x="270" y="248" fill="#ff2bd6">0.24</text>
    </g>
    <rect x="330" y="236" width="0" height="14" rx="3" fill="#ff2bd6" filter="url(#glowMagenta)" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.507;0.536;0.893;0.936;1" values="0;0;1;1;0;0"/>
      <animate attributeName="width" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.507;0.564;1" values="0;0;150;150"/>
    </rect>

    <!-- runner up: any single skill -->
    <g opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.557;0.586;0.893;0.936;1" values="0;0;1;1;0;0"/>
      <text x="45" y="274" fill="#6f6f8a">next-best skill</text>
      <text x="270" y="274" fill="#6f6f8a">0.03</text>
    </g>
    <rect x="330" y="262" width="0" height="14" rx="3" fill="#6f6f8a" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.557;0.586;0.893;0.936;1" values="0;0;1;1;0;0"/>
      <animate attributeName="width" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.557;0.593;1" values="0;0;19;19"/>
    </rect>

  </g>

  <!-- payoff badge -->
  <g opacity="0" transform="translate(45,300)">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
      keyTimes="0;0.614;0.657;0.893;0.936;1" values="0;0;1;1;0;0"/>
    <rect x="0" y="0" width="430" height="40" rx="20" fill="#160026" stroke="#ff2bd6" stroke-width="1.5" filter="url(#glowMagenta)">
      <animate attributeName="stroke" dur="1.4s" repeatCount="indefinite" values="#ff2bd6;#00fff5;#ff2bd6"/>
    </rect>
    <text x="215" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#e8e8f0">🤯 skill COUNT beats skill CHOICE — 8x</text>
  </g>
</svg>
